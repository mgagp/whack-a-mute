# Mises à jour automatiques des dépendances (#62).
# Une PR groupée par semaine pour les correctifs et mineures, les majeures à part.
# GitHub attend déjà 3 jours avant de proposer une nouvelle version (sauf correctif de sécurité).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Montreal
    labels: ["dépendances"]
    groups:
      developpement:
        dependency-type: development
        update-types: [minor, patch]
      jeu:
        dependency-type: production
        update-types: [minor, patch]
    # On reste sur TypeScript 6 tant que typescript-eslint ne prend pas en charge TypeScript 7.
    # À retirer lors de la mise à niveau (#65).
    ignore:
      - dependency-name: typescript
        versions: [">=7"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "06:00"
      timezone: America/Montreal
    labels: ["dépendances"]
    groups:
      actions:
        patterns: ["*"]
