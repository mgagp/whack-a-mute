# Vérifie le jeu sur chaque PR, et avant chaque mise en ligne (appelé par pages.yml) (#5).
name: Vérification

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  verifier:
    name: Typecheck, tests et parcours complet
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm size
      - name: Installer Chromium pour Playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: Parcours complet (téléphone et ordinateur)
        run: pnpm e2e
      - name: Garder le rapport Playwright en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-playwright
          path: |
            playwright-report/
            test-results/
          retention-days: 7
