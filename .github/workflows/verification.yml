# Vérifie le jeu sur chaque PR, et avant chaque mise en ligne (appelé par pages.yml) (#5).
name: Vérification

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  verifier:
    name: Typecheck, tests et parcours complet
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Image officielle de Playwright : Chromium et ses dépendances système sont déjà installés,
    # sans dépendre des serveurs de paquets d'Ubuntu. Sa version doit rester celle de
    # @playwright/test dans package.json (épinglée sans ^ pour cette raison).
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm size
      - name: Parcours complet (téléphone et ordinateur)
        run: pnpm e2e
      - name: Garder le rapport Playwright en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-playwright
          path: |
            playwright-report/
            test-results/
          retention-days: 7
