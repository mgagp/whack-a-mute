# Met le jeu en ligne sur GitHub Pages à chaque push sur main (Q-7),
# seulement si toute la vérification passe, parcours Playwright compris (#5).
name: Mise en ligne

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Comme le workflow officiel de GitHub pour Pages : un déploiement commencé va au bout (#63).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verifier:
    uses: ./.github/workflows/verification.yml

  build:
    needs: verifier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
