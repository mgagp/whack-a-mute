      <stop offset="0" stop-color="#5A2BC0"/>
      <stop offset="0.55" stop-color="#2A1356"/>
      <stop offset="1" stop-color="#160832"/>
    </radialGradient>
    <pattern id="points" width="32" height="32" patternUnits="userSpaceOnUse">
